version: '3.9'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: nestuser
      POSTGRES_PASSWORD: nestpass
      POSTGRES_DB: nestauth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  app:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: nestuser
      DB_PASSWORD: nestpass
      DB_NAME: nestauth
      DATABASE_URL: postgres://nestuser:nestpass@db:5432/nestauth
    command: npm run start:dev

volumes:
  postgres_data:
